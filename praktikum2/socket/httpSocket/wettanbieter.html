<!DOCTYPE html>             <!-- TODO: Wetten auf Risiko prüfen -->
<html lang="de">
	<head>
		<meta charset="UTF-8">
		<title>Wettanbieter</title>
	</head>
	<body>
		<header>
			<h1>Wettanbieter</h1>
		</header>
		<main>
            <section class="content" id="neue-wette">
                <h2>Wette hinzufügen</h2> <!-- via: HTTP POST -->
                <form method="post" action="http://localhost:8080">
                    Team A: <input name = "Input Team A" type="text" id = newTeamA>
                    Gewinnquote: <input type = "number" name = "A Gewinnquote" id = "GewinnquoteA"
										min = "1" step="0.5" value = 1.5>
                    <br>
                    Team B: <input name = "Input Team B" type="text" id = newTeamB>
                    Gewinnquote: <input type = "number" name = "B Gewinnquote" id = "GewinnquoteB"
										min = "1" step="0.5" value = 1.5>
                    <br><br>
                    <input type="submit" value="Abschicken">
                    <input type="reset" value="Zurücksetzen">
                </form>
            </section>

            <hr>

			<section class="content" id="aktuelle-wetten">
				<h2>aktuell angebotene Wetten</h2> <!-- TODO: Infos über HTTP GET holen -->
				Mannschaft A vs. Mannschaft B - Even
					<ul> 
                        {booker_get_bets_of_this_bookmaker}
                        <!--
						<li> Ravenclaw (1.5) vs. Hufflepuff (2.0) <br>
                            40€ vs. 10€ - 0€</li>
						<li> Gryffindor (3.5) vs. Slytherin (1.3) <br>
                            40€ vs. 10€ - 0€</li>
						<li> Chudley Cannons (2.0) vs. Holyhead Harpines (1.5) <br>
                            150€ vs. 200€ - 0€</li>
                        -->
                    </ul>
            </section>

            <hr>

            <!-- TODO: Wetten auf Risiko prüfen -->
            <section class="content" id="Wetten-anpassen">
                <h2>Gewinnquote anpassen</h2>
                    <form method="post" action="http://localhost:8080">
                        <select name = "Spiel"> 
                            {booker_update_get_bets_of_this_bookmaker}
                            <!--
                            <option value = "Ravenclaw vs. Hufflepuff" selected> Ravenclaw (1.5) vs. Hufflepuff (2.0)</option>
                            <option value = "Gryffindor vs. Slytherin">Gryffindor (3.5) vs. Slytherin (1.3)</option>
                            <option value = "Chudley Cannons vs. Holyhead Harpines">Chudley Cannons (2.0) vs. Holyhead Harpines (1.5)</option>
                            -->
                        </select>

                        <br><br>

                        <!-- TODO: akutelle Quote mit HTTP GET auslesen und als default nehmen-->
                        <!-- via JavaScript -->
                        Gewinnquote A: <input type = "number" name = "A Gewinnquote" id = "newGewinnquoteA"
                                            min = "1" step="0.5" value = 1.5>
                        <br>
                        Gewinnquote B: <input type = "number" name = "B Gewinnquote" id = "newGewinnquoteB"
                        min = "1" step="0.5" value = 1.5>
                        <br>
                        Gewinnquote Even: <input type = "number" name = "Even Gewinnquote" id = "newGewinnquoteEven"
                        min = "1" step="0.5" value = 1.5>

                        <br><br>
                        <input type="submit" value="Abschicken">
                        <input type="reset" value="Zurücksetzen">
                    </form>
			</section>
		</main>

        <hr>

		<footer>
			<p>Quidditch-Wettsystem ©</p>
		</footer>
	</body>
</html>
