<!DOCTYPE html>
<html lang="de">
    <!-- Simulation beobachten
		-> auf welche Wetten wurde was gesetzt
		-> Auflistung Wetten (2 Parteien, Gewinnquote)
		-> Anzahl Einsätze
		-> Erklärung des Systems & Link zur Wettseite /-->
	<!-- Verletzungen
		 rote und gelbe Karten
		 Wechsel eines Spielers zu einer neuen Mannschaft und so weiter-->
	<head>
		<meta charset="UTF-8">
		<title>News-Ticker</title>
	</head>
	<body>
		<header>
			<h1>Aktuelle News zum Quidditch Geschehen</h1>
		</header>
		<main>
			<section class="content" id="Spielergebnisse">
				<h2>Empfehlungen des Tages</h2>
				<div style="overflow:scroll; height:300px; background-color:hsla(195, 50%, 79%, 0.584);">
					{news_recommendations}
					<!--
					Montag:
					<ul>
						<li>Tag: SpielerA:B - Quote A, Quote B, Quote Even</li>
						<li></li>
					</ul>
					Sonntag:
					<ul>
						<li>Tag: SpielerA:B - Quote A, Quote B, Quote Even</li>
						<li></li>
					</ul>
					-->
				</div> 
			</section>

			<section class="content" id="Spielergebnisse">
				<h2>Spielergebnisse</h2>
				<ul>
					{news_closed_games}
					<!--
					<li>Ravenclaw vs. Hufflepuff <br>
						200 : 90</li>

					<li>Gryffindor vs. Slytherin <br>
						210 : 20</li>
					-->
				</ul>
			</section>

			<section class="content" id="offeneSpiele">
				<h2>Offene Spiele</h2>
				<ul>
					{news_open_games}
					<!--
					<li>Chudley Cannons vs. Holyhead Harpines</li>
					-->
				</ul>
				
				Schließen Sie 
				<a href="wettender" title="Wette abschließen">
					hier 
				</a> Ihre Wetten ab.
			</section>
		</main>

		<hr>

		<footer>
			<p>Quidditch-Wettsystem ©</p>
		</footer>
	</body>
</html>
