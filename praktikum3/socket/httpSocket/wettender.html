<!DOCTYPE html>
<html lang="de">
	<!-- Wetten schließen; aktuelles Guthaben. gewonnenes Geld, verlorenes Geld -->
	<head>
		<meta charset="UTF-8">
		<title>Wette schließen</title>
	</head>
	<body>
		<header>
			<h1>Wetten Sie hier auf Ihren Favoriten!</h1>

		</header>
		<main>
			<section class="content" id="wette-schliessen">
				<h2>Wette schließen</h2> <!-- TODO: Infos über HTTP GET holen -->
				Mannschaft A vs. Mannschaft B : [Anbieter]
				
				<form method="post" action="http://localhost:8080">
					<select name = "Spiel"> 
						{bettor_post_get_Selection}
						<!--
						<option value = "Ravenclaw vs. Hufflepuff" selected> Ravenclaw (1.5) vs. Hufflepuff (2.0) - Even (4.0)</option>
						<option value = "Gryffindor vs. Slytherin">Gryffindor (3.5) vs. Slytherin (1.3) - Even (4.0)</option>
						<option value = "Chudley Cannons vs. Holyhead Harpines">Chudley Cannons (2.0) vs. Holyhead Harpines (1.5) - Even (4.0)</option>
						-->
					</select>
					
					<select name="gewaehlteMannschaft">
						<option value="Team A" selected> Mannschaft A</option>
						<option value="Team B"> Mannschaft B</option>
						<option value="Even"> Even</option>
					</select>
					<br><br>
					Wetteinsatz: <input name = "Wetteinsatz" type = "number" id = "Geldbetrag"
										min = "10" step="5" value = 10> €

					<br><br>
					Ihr Name: <input name = "Name" type = "text" id = "Name">
					<br><br>
					<input type="submit" value="Abschicken">
					<input type="reset" value="Zurücksetzen">
				</form>
			</section>

			<hr>
			
			<section>
				<h2>Persönliche Übersicht</h2> <!--mit HTTP GET-->
					<form method="post" action="http://localhost:8080">
						Ihr Name: <input name = "GetValuesOfName" type = "text" id = "Name">
						<br><br>
						<input type="submit" value="Abschicken">
						<input type="reset" value="Zurücksetzen">
					</form>
			</section>

		</main>

		<hr>

		<footer>
			<p>Quidditch-Wettsystem ©</p>
		</footer>
	</body>
</html>
