    image: brokermqtt
    container_name: mqttbroker
    ports:
      - 1883:1883
    build:
      context: .
      dockerfile: ./Dockerfile
    networks:
      - vs
    command: /bin/sh -c "while sleep 1000; do :; done"
    
networks:
  vs:
    external: true
